name: CI

# Two quality gates run on every push and pull request:
#   1. the unit/integration test suite
#   2. the AI evaluation harness, which fails the build if answer quality
#      (retrieval hit-rate, groundedness, refusal accuracy, citation validity)
#      drops below the thresholds in agentrag/evaluation.py
#
# Both run entirely offline against the deterministic TF-IDF + extractive
# backends, so CI needs no API keys, no network calls, and no secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        env:
          AGENTRAG_VECTOR_BACKEND: tfidf
          AGENTRAG_LLM_BACKEND: extractive
        run: pytest -q

  evaluate:
    name: AI quality gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluation harness
        env:
          AGENTRAG_VECTOR_BACKEND: tfidf
          AGENTRAG_LLM_BACKEND: extractive
        run: |
          python scripts/run_eval.py \
            --json-out eval_report.json \
            --markdown-out eval_report.md

      - name: Publish metrics to job summary
        if: always()
        run: |
          echo "## AgentRAG AI quality metrics" >> "$GITHUB_STEP_SUMMARY"
          cat eval_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.json
            eval_report.md
